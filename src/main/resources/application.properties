# ===============================
# SERVER CONFIG
# ===============================
server.port=8086
spring.application.name=MEDICAL-MEDIA-SERVICE

# ===============================
# DATABASE
# ===============================
spring.datasource.url=jdbc:mysql://mysql:3306/nephro_medical_media?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ===============================
# MULTIPART (upload fichiers)
# ===============================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ===============================
# EUREKA
# ===============================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ===============================
# SECURITE (NE JAMAIS METTRE EN DUR)
# ===============================
huggingface.api.key=${HUGGINGFACE_KEY:CHANGE_MOI}
jwt.secret=${JWT_SECRET:MaCleJWTMedicaleMinimum256BitsAAAAAAAAAAAAAAAA}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===============================
# CLOUDINARY
# ===============================
cloudinary.cloud-name=${CLOUDINARY_CLOUD:dwehbywnm}

# ===============================
# LOGGING
# ===============================
logging.level.com.esprit=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# ===============================
# ACTUATOR (monitoring)
# ===============================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.prometheus.enabled=true

# ===============================
# SPRINGDOC (Swagger UI)
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true 
